twitchset:
  args:
    - twitchChannel
    - prefix
  desc: 'Sets the Twitch channel the bot joins for this server.'
  params:
    - desc: 'The Twitch channel name, with or without the # prefix.'
      name: twitchChannel
      optional: false
      type: string
    - desc: 'The command prefix used in Twitch chat.'
      name: prefix
      optional: true
      type: string
twitchremove:
  args:
    - ''
  desc: 'Removes the Twitch channel setup of this server and leaves the channel.'
  params: [ ]
twitchenable:
  args:
    - ''
  desc: 'Enables the Twitch integration of this server.'
  params: [ ]
twitchdisable:
  args:
    - ''
  desc: 'Disables the Twitch integration without deleting its configuration.'
  params: [ ]
twitchconfig:
  args:
    - ''
  desc: 'Shows the Twitch configuration of this server.'
  params: [ ]
twitchstatus:
  args:
    - ''
  desc: 'Shows Twitch integration health and configuration status.'
  params: [ ]
twitchprefix:
  args:
    - prefix
  desc: 'Changes the command prefix used in Twitch chat.'
  params:
    - desc: 'The new prefix.'
      name: prefix
      optional: false
      type: string
twitchlanguage:
  args:
    - languageTag
  desc: 'Sets the language of Twitch chat responses, overriding the server locale. Leave empty to reset.'
  params:
    - desc: 'A language tag such as en-US or de-DE.'
      name: languageTag
      optional: true
      type: string
twitchstreaminfo:
  args:
    - title
    - category
  desc: 'Updates the title and category of the Twitch stream.'
  params:
    - desc: 'The new stream title.'
      name: title
      optional: true
      type: string
    - desc: 'The new category name.'
      name: category
      optional: true
      type: string
twitchclip:
  args:
    - ''
  desc: 'Creates a clip of the current Twitch stream.'
  params: [ ]
twitchlink:
  args:
    - user
    - twitchUsername
  desc: 'Links a member to their Twitch account so the bot recognises them in Twitch chat.'
  params:
    - desc: 'The member to link.'
      name: user
      optional: false
      type: IGuildUser
    - desc: 'Their Twitch login name.'
      name: twitchUsername
      optional: false
      type: string
twitchunlink:
  args:
    - user
  desc: 'Removes the Twitch account link of a member.'
  params:
    - desc: 'The member whose link is removed.'
      name: user
      optional: false
      type: IGuildUser
twitchlinks:
  args:
    - ''
  desc: 'Lists the member to Twitch account links of this server.'
  params: [ ]
twitchclaim:
  args:
    - code
  desc: 'Claims a link code generated by the link command in Twitch chat.'
  params:
    - desc: 'The claim code.'
      name: code
      optional: false
      type: string
twitchcommandadd:
  args:
    - name
    - response
    - permission
    - cooldownSeconds
  desc: 'Adds or updates a custom Twitch chat command.'
  params:
    - desc: 'The command name.'
      name: name
      optional: false
      type: string
    - desc: 'The text the command answers with, in quotes when it has spaces.'
      name: response
      optional: false
      type: string
    - desc: 'Who may run it, from Everyone up to Broadcaster.'
      name: permission
      optional: true
      type: TwitchCommandPermission
    - desc: 'Seconds before the command can be used again.'
      name: cooldownSeconds
      optional: true
      type: int
twitchcommandremove:
  args:
    - name
  desc: 'Removes a custom Twitch chat command.'
  params:
    - desc: 'The command name.'
      name: name
      optional: false
      type: string
twitchcommandlist:
  args:
    - ''
  desc: 'Lists the custom Twitch chat commands.'
  params: [ ]
twitchcounterset:
  args:
    - name
    - value
  desc: 'Sets the value of a Twitch counter.'
  params:
    - desc: 'The counter name.'
      name: name
      optional: false
      type: string
    - desc: 'The new value.'
      name: value
      optional: false
      type: int
twitchcounterlist:
  args:
    - ''
  desc: 'Lists the Twitch counters.'
  params: [ ]
twitchscheduleset:
  args:
    - message
  desc: 'Sets the answer of the Twitch schedule chat command.'
  params:
    - desc: 'The schedule message.'
      name: message
      optional: false
      type: string
twitchscheduleclear:
  args:
    - ''
  desc: 'Clears the answer of the Twitch schedule chat command.'
  params: [ ]
twitchsocialsset:
  args:
    - message
  desc: 'Sets the answer of the Twitch socials chat command.'
  params:
    - desc: 'The socials message.'
      name: message
      optional: false
      type: string
twitchsocialsclear:
  args:
    - ''
  desc: 'Clears the answer of the Twitch socials chat command.'
  params: [ ]
twitchtimeradd:
  args:
    - name
    - messages
    - intervalMinutes
    - minChatMessages
    - onlineOnly
    - randomizeMessages
  desc: 'Adds or updates a repeating Twitch chat message timer.'
  params:
    - desc: 'The timer name.'
      name: name
      optional: false
      type: string
    - desc: 'The message to send, in quotes, with several messages on separate lines.'
      name: messages
      optional: false
      type: string
    - desc: 'Minutes between messages.'
      name: intervalMinutes
      optional: true
      type: int
    - desc: 'Chat messages needed between timer messages.'
      name: minChatMessages
      optional: true
      type: int
    - desc: 'Only send while the stream is live.'
      name: onlineOnly
      optional: true
      type: bool
    - desc: 'Pick messages at random instead of in order.'
      name: randomizeMessages
      optional: true
      type: bool
twitchtimerremove:
  args:
    - name
  desc: 'Removes a repeating Twitch chat message timer.'
  params:
    - desc: 'The timer name.'
      name: name
      optional: false
      type: string
twitchtimerlist:
  args:
    - ''
  desc: 'Lists the repeating Twitch chat message timers.'
  params: [ ]
twitchtimerenable:
  args:
    - name
  desc: 'Enables a repeating Twitch chat message timer.'
  params:
    - desc: 'The timer name.'
      name: name
      optional: false
      type: string
twitchtimerdisable:
  args:
    - name
  desc: 'Disables a repeating Twitch chat message timer.'
  params:
    - desc: 'The timer name.'
      name: name
      optional: false
      type: string
twitchtimertest:
  args:
    - name
  desc: 'Sends a repeating Twitch chat message timer to chat right away.'
  params:
    - desc: 'The timer name.'
      name: name
      optional: false
      type: string
twitchgolive:
  args:
    - channel
    - message
  desc: 'Sets the channel for go-live notifications, with an optional custom message.'
  params:
    - desc: 'The channel to post in.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'A message that can use %streamer%, %title%, %game% and %url%.'
      name: message
      optional: true
      type: string
twitchgoliveclear:
  args:
    - ''
  desc: 'Clears the go-live notification channel.'
  params: [ ]
twitchsubchannel:
  args:
    - channel
    - message
  desc: 'Sets the channel for Twitch subscription notifications.'
  params:
    - desc: 'The channel to post in.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'An optional custom message.'
      name: message
      optional: true
      type: string
twitchsubclear:
  args:
    - ''
  desc: 'Disables Twitch subscription notifications.'
  params: [ ]
twitchraidchannel:
  args:
    - channel
    - message
  desc: 'Sets the channel for Twitch raid notifications.'
  params:
    - desc: 'The channel to post in.'
      name: channel
      optional: false
      type: ITextChannel
    - desc: 'An optional custom message.'
      name: message
      optional: true
      type: string
twitchraidclear:
  args:
    - ''
  desc: 'Disables Twitch raid notifications.'
  params: [ ]
twitchrecapchannel:
  args:
    - channel
  desc: 'Sets the channel for end of stream recaps.'
  params:
    - desc: 'The channel to post in.'
      name: channel
      optional: false
      type: ITextChannel
twitchrecapclear:
  args:
    - ''
  desc: 'Disables stream recap posts.'
  params: [ ]
twitchrolesyncadd:
  args:
    - twitchRank
    - role
  desc: 'Syncs a Twitch rank to a Discord role.'
  params:
    - desc: 'The Twitch rank, from Everyone up to Broadcaster.'
      name: twitchRank
      optional: false
      type: TwitchPermissionLevel
    - desc: 'The role members with that rank receive.'
      name: role
      optional: false
      type: IRole
twitchrolesyncremove:
  args:
    - twitchRank
    - role
  desc: 'Removes a Twitch rank to Discord role sync.'
  params:
    - desc: 'The Twitch rank.'
      name: twitchRank
      optional: false
      type: TwitchPermissionLevel
    - desc: 'The synced role.'
      name: role
      optional: false
      type: IRole
twitchrolesynclist:
  args:
    - ''
  desc: 'Lists the Twitch rank to Discord role syncs.'
  params: [ ]
twitchredemptionadd:
  args:
    - rewardTitle
    - twitchResponse
    - discordChannel
    - discordMessage
  desc: 'Adds or updates a channel point redemption action.'
  params:
    - desc: 'The title of the channel point reward, in quotes when it has spaces.'
      name: rewardTitle
      optional: false
      type: string
    - desc: 'What the bot answers in Twitch chat.'
      name: twitchResponse
      optional: true
      type: string
    - desc: 'A channel to announce the redemption in.'
      name: discordChannel
      optional: true
      type: ITextChannel
    - desc: 'The announcement text.'
      name: discordMessage
      optional: true
      type: string
twitchredemptionremove:
  args:
    - rewardTitle
  desc: 'Removes a channel point redemption action.'
  params:
    - desc: 'The title of the channel point reward.'
      name: rewardTitle
      optional: false
      type: string
twitchredemptionlist:
  args:
    - ''
  desc: 'Lists the channel point redemption actions.'
  params: [ ]
twitchraidtargetadd:
  args:
    - twitchLogin
    - note
  desc: 'Adds or updates a Twitch raid target suggestion.'
  params:
    - desc: 'The Twitch login of the channel.'
      name: twitchLogin
      optional: false
      type: string
    - desc: 'An optional note about the target.'
      name: note
      optional: true
      type: string
twitchraidtargetremove:
  args:
    - twitchLogin
  desc: 'Removes a Twitch raid target suggestion.'
  params:
    - desc: 'The Twitch login of the channel.'
      name: twitchLogin
      optional: false
      type: string
twitchraidtargetlist:
  args:
    - ''
  desc: 'Lists the Twitch raid target suggestions.'
  params: [ ]
