importxp:
  args:
    - source
    - apiKey
    - merge
    - minimumLevel
    - keepCurve
    - roleRewards
    - syncRoles
  desc: 'Imports member XP and level role rewards from another bot. Attach the export file to the message for file based sources.'
  params:
    - desc: 'The bot the data comes from: Mee6, Lurkr, Polaris, Arcane, Amari, Tatsu or File.'
      name: source
      optional: false
      type: ImportSource
    - desc: 'The API key, for Amari and Tatsu.'
      name: apiKey
      optional: true
      type: string
    - desc: 'How imported XP combines with existing XP.'
      name: merge
      optional: true
      type: ImportMergeMode
    - desc: 'Skips members below this level.'
      name: minimumLevel
      optional: true
      type: int
    - desc: 'Switches to the source level curve when it has one.'
      name: keepCurve
      optional: true
      type: bool
    - desc: 'Also imports level role rewards.'
      name: roleRewards
      optional: true
      type: bool
    - desc: 'Hands out reward roles to members afterwards.'
      name: syncRoles
      optional: true
      type: bool
importcurrency:
  args:
    - token
    - merge
  desc: 'Imports member wallet and bank balances from UnbelievaBoat.'
  params:
    - desc: 'An UnbelievaBoat application token authorized on this server.'
      name: token
      optional: false
      type: string
    - desc: 'How imported balances combine with existing balances.'
      name: merge
      optional: true
      type: ImportMergeMode
importmee6settings:
  args:
    - ''
  desc: 'Imports MEE6 welcome, levels, commands, role menus, filters and more from the exported settings file attached to the message.'
  params: [ ]
importundo:
  args:
    - ''
  desc: 'Undoes the most recent import made in the last 24 hours.'
  params: [ ]
